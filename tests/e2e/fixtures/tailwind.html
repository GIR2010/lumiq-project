<!doctype html>
<html><head><meta charset="utf-8"><title>Tailwind opacity channels</title>
<style>
  body { margin: 0; background: #fff; }
  .t { --tw-bg-opacity: 1; background-color: rgb(255 255 255 / var(--tw-bg-opacity)); height: 40px; }
  .x { --tw-text-opacity: 1; color: rgb(42 42 47 / var(--tw-text-opacity)); }
</style></head>
<body>
  <div class="t">panel</div>
  <p class="x">Tailwind text</p>
</body></html>
